<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>fackmy.IL - צ'אטים</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rubik', sans-serif; }
        body { background: #0f172a url('appimg/back.jpg') center/cover no-repeat fixed; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 15px; position: relative; }
        body::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); z-index: 1; }
        .top-navbar { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); width: 100%; max-width: 600px; padding: 12px 20px; border-radius: 22px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin-bottom: 20px; position: relative; z-index: 2; }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-container img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        .logo-container h1 { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #8a2387, #e94057); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-buttons { display: flex; gap: 8px; }
        .nav-btn { background: #f0f0f0; border: none; padding: 8px 14px; border-radius: 18px; color: #555; font-size: 13px; font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 6px; }
        .chats-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 2; }
        .chat-card { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 8px 20px rgba(0,0,0,0.2); cursor: pointer; }
        .chat-user { display: flex; align-items: center; gap: 15px; width: 100%; }
        .chat-avatar-box { position: relative; width: 55px; height: 55px; flex-shrink: 0; }
        .chat-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #8a2387; }
        .online-dot-small { width: 12px; height: 12px; border-radius: 50%; background: #2ecc71; border: 2px solid white; position: absolute; bottom: 0; right: 0; }
        .offline-dot-small { width: 12px; height: 12px; border-radius: 50%; background: #ccc; border: 2px solid white; position: absolute; bottom: 0; right: 0; }
        .chat-details { flex: 1; min-width: 0; }
        .chat-details-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .chat-details h4 { font-size: 15px; color: #333; font-weight: 700; }
        .chat-time { font-size: 11px; color: #888; }
        .chat-details p { font-size: 13px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

<div class="top-navbar">
    <div class="logo-container">
        <img src="appimg/logo.jpg" alt="fackmy.IL">
        <h1>fackmy.IL צ'אטים</h1>
    </div>
    <div class="nav-buttons">
        <a href="home.html" class="nav-btn"><i class="fa-solid fa-house"></i> בית</a>
        <a href="afterlog.html" class="nav-btn"><i class="fa-solid fa-user"></i> פרופיל</a>
    </div>
</div>

<div class="chats-container" id="chats-list">
    <p style="text-align: center; color: white;">טוען שיחות...</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC_NsvhGHX9nUMkEy_N8M5wLmFP7gPT__w",
      authDomain: "my-app-329b0.firebaseapp.com",
      projectId: "my-app-329b0",
      storageBucket: "my-app-329b0.firebasestorage.app",
      messagingSenderId: "335805777525",
      appId: "1:335805777525:web:1bcf62a3b5193cf3aada3c",
      measurementId: "G-WFGBW108BL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a0a0a0'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";

    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = 'index.html'; return; }

        const chatsList = document.getElementById('chats-list');
        const q = query(collection(db, "chats"), where("participants", "array-contains", user.uid));

        onSnapshot(q, async (snapshot) => {
            if (snapshot.empty) {
                chatsList.replaceChildren();
                const empty = document.createElement('p');
                empty.textContent = 'אין עדיין שיחות פעילות ב-fackmy.IL';
                empty.style.cssText = 'text-align:center;color:white';
                chatsList.appendChild(empty);
                return;
            }

            chatsList.innerHTML = '';
            for (const chatDoc of snapshot.docs) {
                const data = chatDoc.data();
                const otherUid = data.participants.find(id => id !== user.uid);
                if (!otherUid) continue;

                const otherUserSnap = await getDoc(doc(db, "users", otherUid));
                if (otherUserSnap.exists()) {
                    const uData = otherUserSnap.data();
                    const dotClass = uData.isOnline ? 'online-dot-small' : 'offline-dot-small';
                    
                    let lastMsg = data.lastMessage || 'התחל שיחה...';
                    const words = lastMsg.split(' ');
                    if (words.length > 5) lastMsg = words.slice(0, 5).join(' ') + '...';

                    let timeStr = data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : '';

                    const card = document.createElement('div');
                    card.className = 'chat-card';
                    card.addEventListener('click', () => { window.location.href = 'chat.html?target=' + encodeURIComponent(otherUid); });
                    const userRow = document.createElement('div'); userRow.className = 'chat-user';
                    const avatarBox = document.createElement('div'); avatarBox.className = 'chat-avatar-box';
                    const avatar = document.createElement('img'); avatar.className = 'chat-avatar'; avatar.alt = 'תמונת פרופיל'; avatar.src = uData.profileImg || defaultAvatar;
                    const dot = document.createElement('div'); dot.className = dotClass;
                    avatarBox.append(avatar, dot);
                    const details = document.createElement('div'); details.className = 'chat-details';
                    const top = document.createElement('div'); top.className = 'chat-details-top';
                    const name = document.createElement('h4'); name.textContent = uData.fullName || uData.username || 'משתמש';
                    if (uData.role === 'pro' || uData.isPro === true || uData.subscriptionStatus === 'pro-demo') {
                        const badge = document.createElement('span'); badge.textContent = ' ✦ PRO'; badge.style.color = '#b8860b'; name.appendChild(badge);
                    }
                    const time = document.createElement('span'); time.className = 'chat-time'; time.textContent = timeStr;
                    top.append(name, time);
                    const preview = document.createElement('p'); preview.textContent = lastMsg;
                    details.append(top, preview); userRow.append(avatarBox, details); card.appendChild(userRow); chatsList.appendChild(card);
                }
            }
        });
    });
</script>
</body>
</html>
