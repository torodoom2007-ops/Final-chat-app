<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>fackmy.IL - אזור אישי</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rubik', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background: #0f172a url('appimg/back.jpg?v=2') center/cover no-repeat fixed; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px 15px; 
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .top-navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 600px;
            padding: 12px 20px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
        }

        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-container img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        .logo-container h1 { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #8a2387, #e94057); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-buttons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .nav-btn { background: #f0f0f0; border: none; padding: 8px 12px; border-radius: 18px; color: #555; font-size: 12px; font-weight: bold; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 5px; transition: background 0.2s; }
        .nav-btn:hover { background: #e2e8f0; color: #8a2387; }

        .card-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 600px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .card-header {
            background: linear-gradient(135deg, #8a2387, #e94057, #f27121);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-box {
            width: 85px;
            height: 85px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.8);
        }

        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .card-header h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .card-header p { font-size: 13px; opacity: 0.9; }

        .edit-profile-action-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
            text-decoration: none;
        }

        .card-body { padding: 25px 20px; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .detail-item { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 20px; padding: 15px; }
        .detail-label { font-size: 11px; color: #888; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
        .detail-value { font-size: 14px; font-weight: 600; color: #333; word-break: break-all; }
        .bio-item { grid-column: 1 / -1; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 20px; padding: 15px; }

        @media (max-width: 480px) {
            .details-grid { grid-template-columns: 1fr; }
            .edit-profile-action-btn { position: relative; top: 0; right: 0; margin-top: 15px; }
            .top-navbar { padding: 10px 12px; }
            .logo-container h1 { font-size: 15px; }
            .nav-btn { padding: 6px 10px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <div class="logo-container">
            <img src="appimg/logo.jpg?v=2" alt="fackmy.IL Logo">
            <h1>fackmy.IL</h1>
        </div>
        <div class="nav-buttons">
            <a href="home.html" class="nav-btn"><i class="fa-solid fa-house"></i> בית</a>
            <a href="premium.html" class="nav-btn" style="background:linear-gradient(110deg,#f6d782,#e5b6ff);color:#28153c;font-weight:800"><i class="fa-solid fa-gem"></i> Pro</a>
            <a href="chats.html" class="nav-btn"><i class="fa-solid fa-comments"></i> צ'אטים</a>
            <button class="nav-btn" onclick="logoutUser()"><i class="fa-solid fa-right-from-bracket"></i> התנתק</button>
        </div>
    </div>

    <div class="card-container">
        <div class="card-header">
            <a href="yourprofile.html?edit=true" class="edit-profile-action-btn">
                <i class="fa-solid fa-pen-to-square"></i> ערוך פרופיל
            </a>

            <div class="avatar-box">
                <img id="user-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a0a0a0'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>" alt="Avatar">
            </div>
            <h2 id="display-fullname">טוען...</h2>
            <p id="display-username">@username</p>
            <p id="pro-status" style="margin-top:8px"></p>
        </div>

        <div class="card-body">
            <a href="premium.html" style="display:block;text-align:center;text-decoration:none;padding:13px;border-radius:14px;background:linear-gradient(100deg,#261447,#854dca,#f0b8ff);color:white;font-weight:800;margin-bottom:18px;box-shadow:0 8px 24px #854dca55">✦ שדרוג ל-Pro — $3 לחודש</a>
            <div class="details-grid">
                <div class="detail-item">
                    <div class="detail-label"><i class="fa-solid fa-envelope"></i> אימייל</div>
                    <div class="detail-value" id="info-email">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label"><i class="fa-solid fa-location-dot"></i> עיר מגורים</div>
                    <div class="detail-value" id="info-city">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label"><i class="fa-solid fa-cake-candles"></i> גיל / תאריך לידה</div>
                    <div class="detail-value" id="info-age">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label"><i class="fa-solid fa-fingerprint"></i> מזהה משתמש (UID)</div>
                    <div class="detail-value" id="info-uid" style="font-size: 11px;">-</div>
                </div>
                <div class="bio-item">
                    <div class="detail-label"><i class="fa-solid fa-address-card"></i> תיאור (Bio)</div>
                    <div class="detail-value" id="info-bio" style="font-weight: 400; color: #555;">טרם הוזן תיאור אישי...</div>
                </div>
            </div>
            <button onclick="deleteAccount()" style="margin-top:18px;background:#fff0f2;color:#a31535;border:1px solid #f5b8c5;padding:11px 15px;border-radius:12px;width:100%;font-weight:700;cursor:pointer">מחיקת החשבון שלי</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC_NsvhGHX9nUMkEy_N8M5wLmFP7gPT__w",
      authDomain: "my-app-329b0.firebaseapp.com",
      projectId: "my-app-329b0",
      storageBucket: "my-app-329b0.firebasestorage.app",
      messagingSenderId: "335805777525",
      appId: "1:335805777525:web:1bcf62a3b5193cf3aada3c",
      measurementId: "G-WFGBW108BL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById('info-email').innerText = user.email || 'אנונימי';
            document.getElementById('info-uid').innerText = user.uid;

            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    document.getElementById('display-fullname').innerText = data.fullName || data.username || 'משתמש fackmy.IL';
                    document.getElementById('display-username').innerText = '@' + (data.username || 'user');
                    document.getElementById('info-city').innerText = data.city || 'לא צוין';
                    document.getElementById('info-bio').innerText = data.bio || 'טרם הוזן תיאור אישי...';
                    
                    if (data.birthDate) {
                        const age = new Date().getFullYear() - new Date(data.birthDate).getFullYear();
                        document.getElementById('info-age').innerText = `${data.birthDate} (גיל ${age})`;
                    } else {
                        document.getElementById('info-age').innerText = 'לא צוין';
                    }

                    if (data.role === "pro" || data.isPro === true || data.subscriptionStatus === "pro-demo") {
                        document.getElementById('pro-status').innerHTML = '<span style="display:inline-block;padding:6px 13px;border-radius:99px;background:linear-gradient(90deg,#f5d77e,#f0b8ff);color:#2b1740;font-weight:800;box-shadow:0 0 18px #f0b8ff88">✦ PRO</span>';
                    }
                    if (data.profileImg) {
                        document.getElementById('user-avatar').src = data.profileImg;
                    }
                }
            } catch (err) { console.error(err); }
        } else {
            window.location.href = 'index.html';
        }
    });

    window.deleteAccount = async function() {
        const user = auth.currentUser;
        if (!user) return;
        if (!confirm("מחיקת החשבון היא פעולה בלתי הפיכה. למחוק את חשבון המשתמש?")) return;
        if (!confirm("אישור אחרון: הפרופיל יוסר. ייתכן שהודעות ישנות יישארו עד להגדרת מחיקה מלאה בצד שרת. להמשיך?")) return;
        try {
            await deleteDoc(doc(db, "users", user.uid));
            await deleteUser(user);
            window.location.href = "index.html";
        } catch (err) {
            alert("לא ניתן למחוק כרגע. ייתכן ש-Firebase דורש התחברות מחדש. התחבר מחדש ונסה שוב. " + err.message);
        }
    };
    window.logoutUser = async function() {
        await signOut(auth);
        window.location.href = 'index.html';
    };
</script>

</body>
</html>
