<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMINOS - לוח בקרה מנהל</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rubik', sans-serif; }
        body {
            background: #f4f7fe;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #8a2387, #e94057);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header .logo-area img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .btn-logout {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-logout:hover { background: rgba(255,255,255,0.3); }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-card i {
            font-size: 35px;
            color: #8a2387;
        }

        .stat-card h3 {
            font-size: 24px;
            color: #333;
        }

        .stat-card p {
            color: #888;
            font-size: 13px;
        }

        .content-box {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.03);
        }

        .content-box h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
        }

        .status-pill {
            display: inline-block;
            background: #e8f8f0;
            color: #2ecc71;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-area">
        <img src="appimg/logo.svg" alt="ADMINOS">
        <h1>ADMINOS - לוח בקרה למנהל</h1>
    </div>
    <button class="btn-logout" onclick="window.location.href='log.html'">יציאה</button>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <i class="fa-solid fa-users"></i>
            <div>
                <h3>1</h3>
                <p>מנהלים מחוברים</p>
            </div>
        </div>
        <div class="stat-card">
            <i class="fa-solid fa-server"></i>
            <div>
                <h3>תקין</h3>
                <p>סטטוס שרת Render</p>
            </div>
        </div>
        <div class="stat-card">
            <i class="fa-solid fa-shield-halved"></i>
            <div>
                <h3>פעיל</h3>
                <p>אבטחת Firebase</p>
            </div>
        </div>
    </div>

    <div class="content-box">
        <h2>אזור ניהול ראשי</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 15px;">
            ברוך הבא למערכת הניהול. מכאן תוכל לצפות בנתוני האפליקציה, לנהל משתמשים ולהגדיר הגדרות מערכת.
        </p>
        <span class="status-pill"><i class="fa-solid fa-check"></i> מערכת ADMINOS מחוברת</span>
    </div>
</div>

</body>
</html>
