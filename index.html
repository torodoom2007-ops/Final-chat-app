<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>fackmy.IL - אפליקציית היכרויות למבוגרים</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rubik', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #0f172a url('appimg/back.jpg') center/cover no-repeat fixed; 
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px; position: relative;
        }
        body::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); z-index: 1; }
        
        .card-container { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); width: 100%; max-width: 420px; border-radius: 28px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4); overflow: hidden; position: relative; z-index: 2; margin-bottom: 20px; }
        .card-header { background: linear-gradient(135deg, #8a2387, #e94057, #f27121); color: white; padding: 30px 20px; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
        .avatar-logo { width: 75px; height: 75px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px auto; box-shadow: 0 8px 16px rgba(0,0,0,0.2); overflow: hidden; }
        .avatar-logo img { width: 100%; height: 100%; object-fit: cover; }
        .card-header h2 { font-size: 26px; font-weight: 700; }
        .app-description { font-size: 13px; color: rgba(255, 255, 255, 0.95); margin-top: 6px; }
        .card-body { padding: 25px 22px; }
        .toggle-text { text-align: center; margin-bottom: 22px; font-size: 14px; color: #555; }
        .toggle-text a { color: #8a2387; text-decoration: none; font-weight: bold; cursor: pointer; }
        .input-group { position: relative; margin-bottom: 16px; }
        .input-group i.icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #a0a0a0; font-size: 16px; }
        .input-group input { width: 100%; padding: 14px 45px 14px 20px; border: 2px solid #e1e1e1; border-radius: 25px; outline: none; font-size: 14px; direction: ltr; text-align: right; }
        .input-group input:focus { border-color: #8a2387; }
        .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 25px; background: linear-gradient(135deg, #8a2387, #e94057); color: white; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 20px rgba(233, 64, 87, 0.3); }
        .btn-guest { width: 100%; padding: 12px; margin-top: 12px; border: 2px solid #8a2387; border-radius: 25px; background: transparent; color: #8a2387; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-guest:hover { background: #8a2387; color: white; }
        .register-only { display: none; }

        /* פוטר משפטי בתחתית דף הכניסה */
        .site-footer { width: 100%; max-width: 420px; text-align: center; padding: 10px; position: relative; z-index: 2; color: rgba(255, 255, 255, 0.85); font-size: 12px; }
        .footer-links { display: flex; justify-content: center; gap: 15px; margin-top: 6px; flex-wrap: wrap; }
        .footer-links a { color: #fff; text-decoration: none; font-weight: 500; transition: opacity 0.2s; }
        .footer-links a:hover { opacity: 0.7; text-decoration: underline; }
        .remember-row{display:flex;align-items:center;gap:9px;font-size:13px;color:#555;margin:12px 0;cursor:pointer}
        .remember-row input{width:17px;height:17px;accent-color:#c02676}
        .auth-note{font-size:11px;color:#777;text-align:center;margin:8px 0 12px}
        .register-only{display:none}
    </style>
</head>
<body>

<div class="card-container">
    <div class="card-header">
        <div class="avatar-logo">
            <img src="appimg/logo.jpg" alt="fackmy.IL Logo">
        </div>
        <h2>fackmy.IL</h2>
        <p class="app-description">אפליקציית היכרויות למבוגרים • 18+ • צ'אט חינם</p>
    </div>

    <div class="card-body">
        <div class="toggle-text">
            <span id="toggle-desc">עדיין לא רשום?</span> 
            <a id="toggle-btn" onclick="toggleMode()">לחץ כאן להרשמה</a>
        </div>

        <form id="auth-form" onsubmit="handleSubmit(event)">
            <div class="input-group">
                <i class="fa-solid fa-user icon"></i>
                <input type="text" id="username" placeholder="שם משתמש / אימייל" required>
            </div>

            <div class="input-group register-only" id="email-group">
                <i class="fa-solid fa-envelope icon"></i>
                <input type="email" id="email" placeholder="אימייל">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" id="password" placeholder="סיסמה" required>
            </div>

            <label class="remember-row"><input type="checkbox" id="remember-me" checked> זכור את הפרטים שלי במכשיר הזה</label>
            <p class="auth-note">השירות מיועד לבני ובנות 18 ומעלה בלבד.</p>
            <button type="submit" class="btn-submit" id="submit-btn">התחבר</button>
        </form>

        <button class="btn-guest" onclick="loginAnonymously()"><i class="fa-solid fa-user-ninja"></i> כניסה כמשתמש אנונימי (אורח)</button>
    </div>
</div>

<!-- פוטר משפטי -->
<footer class="site-footer">
    <div>© 2026 fackmy.IL • כל הזכויות שמורות (18+)</div>
    <div class="footer-links">
        <a href="privacy.html">מדיניות פרטיות</a>
        <a href="terms.html">תנאי שימוש</a>
        <a href="guidelines.html">הנחיות קהילה</a>
    </div>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInAnonymously, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, query, collection, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC_NsvhGHX9nUMkEy_N8M5wLmFP7gPT__w",
      authDomain: "my-app-329b0.firebaseapp.com",
      projectId: "my-app-329b0",
      storageBucket: "my-app-329b0.firebasestorage.app",
      messagingSenderId: "335805777525",
      appId: "1:335805777525:web:1bcf62a3b5193cf3aada3c",
      measurementId: "G-WFGBW108BL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isRegisterMode = false;

    window.toggleMode = function() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('toggle-desc').innerText = isRegisterMode ? 'כבר רשום?' : 'עדיין לא רשום?';
        document.getElementById('toggle-btn').innerText = isRegisterMode ? 'לחץ כאן להתחברות' : 'לחץ כאן להרשמה';
        document.getElementById('submit-btn').innerText = isRegisterMode ? 'הירשם עכשיו' : 'התחבר';
        document.querySelectorAll('.register-only').forEach(el => el.style.display = isRegisterMode ? 'block' : 'none');
    };

    window.loginAnonymously = async function() {
        try {
            const userCred = await signInAnonymously(auth);
            await setDoc(doc(db, "users", userCred.user.uid), {
                username: "אורח_" + Math.floor(1000 + Math.random() * 9000),
                isAnonymous: true,
                role: "regular",
                isPro: false,
                subscriptionStatus: "free",
                createdAt: new Date().toISOString()
            });
            window.location.href = 'home.html';
        } catch (error) {
            alert("שגיאה בכניסה אנונימית: " + error.message);
        }
    };

    window.handleSubmit = async function(event) {
        event.preventDefault();
        const usernameVal = document.getElementById('username').value.trim();
        const passwordVal = document.getElementById('password').value;

        try {
            await setPersistence(auth, document.getElementById('remember-me').checked ? browserLocalPersistence : browserSessionPersistence);
            if (isRegisterMode) {
                if (!usernameVal || usernameVal.length < 3) throw new Error("שם המשתמש חייב להכיל לפחות 3 תווים.");
                const emailVal = document.getElementById('email').value.trim();
                const userCred = await createUserWithEmailAndPassword(auth, emailVal, passwordVal);
                await setDoc(doc(db, "users", userCred.user.uid), {
                    username: usernameVal.toLowerCase(),
                    email: emailVal,
                    isAnonymous: false,
                    role: "regular",
                    isPro: false,
                    subscriptionStatus: "free",
                    createdAt: new Date().toISOString()
                });
                window.location.href = 'yourprofile.html';
            } else {
                let loginEmail = usernameVal;
                if (!usernameVal.includes('@')) {
                    const q = query(collection(db, "users"), where("username", "==", usernameVal.toLowerCase()));
                    const snap = await getDocs(q);
                    if (!snap.empty) snap.forEach(d => loginEmail = d.data().email);
                }
                await signInWithEmailAndPassword(auth, loginEmail, passwordVal);
                window.location.href = 'home.html';
            }
        } catch (error) {
            alert("שגיאה: " + error.message);
        }
    };
</script>
</body>
</html>
